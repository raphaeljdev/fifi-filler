<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Cadastro</title></head>
<body>
  <header>
    <form role="search"><input name="q" placeholder="Buscar produtos"></form>
  </header>

  <main>
    <form id="signup">
      <label for="nome">Nome</label><input id="nome">
      <label for="sobrenome">Sobrenome</label><input id="sobrenome">
      <label for="mail">E-mail</label><input id="mail" type="email">
      <label for="mail2">Confirme o e-mail</label><input id="mail2" type="email">
      <label for="pw">Senha</label><input id="pw" type="password">
      <label for="pw2">Confirmar senha</label><input id="pw2" type="password">
      <label for="doc">CPF</label><input id="doc">
      <label for="nasc">Data de nascimento</label><input id="nasc">
      <label for="cel">Celular</label><input id="cel" type="tel">
      <label for="cep">CEP</label><input id="cep">
      <label for="rua">Endereço</label><input id="rua">
      <label for="num">Número</label><input id="num">
      <label for="compl">Complemento</label><input id="compl">
      <label for="bairro">Bairro</label><input id="bairro">
      <label for="cidade">Cidade</label><input id="cidade">
      <label for="uf">Estado</label>
      <select id="uf"><option value="">Selecione</option><option value="RJ">Rio de Janeiro</option><option value="SP">São Paulo</option></select>
      <label for="civil">Estado civil</label>
      <select id="civil"><option value="">-</option><option>Solteiro</option></select>
      <label for="hotel">Hotel preferido</label><input id="hotel">
      <label for="card">Número do cartão</label><input id="card">
      <button type="button">Cancelar</button>
      <button>Cadastrar</button>
    </form>
  </main>

  <footer>
    <form id="news"><label for="newsmail">Receba ofertas por e-mail</label><input id="newsmail" type="email"><button>Assinar</button></form>
  </footer>
</body></html>
