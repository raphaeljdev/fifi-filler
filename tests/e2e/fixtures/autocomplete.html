<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Autocomplete</title></head>
<body>
  <form>
    <input name="f1" autocomplete="given-name">
    <input name="f2" autocomplete="family-name">
    <input name="f3" autocomplete="tel-area-code" maxlength="2">
    <input name="f4" autocomplete="tel-local">
    <select name="f5" autocomplete="bday-day"><option value="">d</option><option>4</option><option>5</option><option>6</option></select>
    <select name="f6" autocomplete="bday-month"><option value="">m</option><option value="1">Janeiro</option><option value="2">Fevereiro</option></select>
    <select name="f7" autocomplete="bday-year"><option value="">y</option><option>1999</option><option>2000</option></select>
    <input name="f8" autocomplete="postal-code">
    <input name="weird_x1">
  </form>
</body></html>
